<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xtrapartial</title>
<meta name="description" content="a movement-first round and team shooter. new maps and weapons being added. free download.">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="xtrapartial">
<meta property="og:description" content="a movement-first round and team shooter. new maps and weapons being added. free download.">
<meta property="og:image" content="https://shrimpsooup2.github.io/xpl/assets/logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.add("js")</script>
<script src="site.js" defer></script>
</head>
<body>
<!--
	The page's words and buttons live here; site.js draws them small on the
	canvas and blows it up in hard pixels, and lays these over it unseen so
	links, the keyboard and screen readers still work.

	Downloads: put each build's address in its href. An empty one says
	"soon :)". Each one's title is its tooltip (drawn by site.js on hover
	or focus, the browser's own without the script). Pictures: list them in
	data-shots, comma-separated (e.g. "shots/boulevard.png, shots/depot.png");
	none shows stand-ins.

	The version (data-version, and the tag's text) is stamped in by
	tools/build_site.sh from project.godot's application/config/version:
	don't edit it here. Releasing: docs/RELEASING.md.
-->
<main id="screen" class="screen" data-version="0.1.0">
	<canvas id="pixels" aria-hidden="true"></canvas>

	<div class="card" data-card="logo">
		<h1>xtrapartial</h1>
		<p class="version">v0.1.0</p>
	</div>

	<div class="card" data-card="info">
		<ul>
			<li>-movement first round and team shooter</li>
			<li>-new maps + weapons being added</li>
			<li>-free download :)</li>
		</ul>
		<a class="hit" data-button="pc" data-label="↓ pc (beta)" href="downloads/xtrapartial-windows-beta.zip"
			title="beta for testers: windows 10 or 11, 64-bit. unzip it and run xtrapartial.exe; if windows warns you, click more info, then run anyway">download for pc (beta)</a>
		<a class="hit" data-button="mac" data-label="↓ mac" href=""
			title="macOS 11 or newer, apple silicon or intel. unzip it; the first time, right-click the game and pick open">download for mac</a>
		<a class="hit" data-button="server" data-label="↓ server" href=""
			title="the dedicated server, for linux: no window, it hosts games for other players. how to run one is in the readme">download the server build</a>
	</div>

	<div class="card" data-card="pictures" data-shots="shots/stack.png, shots/terrace.png, shots/switchback.png, shots/rift.png, shots/rift_signal.png, shots/boulevard.png, shots/boulevard_fountain.png" role="region" aria-roledescription="carousel" aria-label="pictures">
		<p class="caption" aria-live="polite">pictures of the game</p>
		<button class="hit" data-button="prev" type="button">previous picture</button>
		<button class="hit" data-button="next" type="button">next picture</button>
	</div>

	<p id="status" class="sr-only" aria-live="polite"></p>
</main>
</body>
</html>
