<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>timed out · xtrapartial</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon.png">
<link rel="stylesheet" href="site.css">
<script>document.documentElement.classList.add("js")</script>
<script src="site.js" defer></script>
</head>
<body>
<main id="screen" class="screen">
	<canvas id="pixels" aria-hidden="true"></canvas>

	<div class="card" data-card="logo">
		<h1>xtrapartial</h1>
	</div>

	<div class="card" data-card="info">
		<ul>
			<li>-nothing here</li>
			<li>-this page timed out</li>
		</ul>
		<a class="hit" data-button="home" data-label="← home" href="./">back home</a>
	</div>

	<div class="card" data-card="pictures" data-shots="" role="region" aria-roledescription="carousel" aria-label="pictures">
		<p class="caption" aria-live="polite">pictures soon</p>
		<button class="hit" data-button="prev" type="button">previous picture</button>
		<button class="hit" data-button="next" type="button">next picture</button>
	</div>

	<p id="status" class="sr-only" aria-live="polite"></p>
</main>
</body>
</html>
