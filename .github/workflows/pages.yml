# Publishes the website (site/, put together by tools/build_site.sh) to
# GitHub Pages whenever it changes on main. In the repository's settings,
# Pages → Build and deployment → Source must be "GitHub Actions".
name: website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/ui/**"
      - "assets/fonts/**"
      - "tools/build_site.sh"
      - "project.godot"  # The version shown on the site.
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cutting one short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/build_site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
