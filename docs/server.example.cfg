; An xtrapartial dedicated server's settings (docs/NETWORKING.md).
; Copy this somewhere, change what you need, and start the server with it:
;
;   godot --headless --path . -- --server --config /path/to/server.cfg
;
; Anything given on the command line as well (--port 27961, --mode teams,
; --health 150, ...) wins over what's here. Values that don't make sense fall
; back to the default, and keys the server doesn't know are ignored.

[server]

; Shown to players when they join. Up to 32 characters.
name="xtrapartial server"

; The UDP port players connect to (1024-65535). Open or forward it on your
; firewall/router to let people in from outside your network.
port=27960

; The most people who can be connected at once (1-16; bots don't count).
max_players=8

; Leave empty for a public server. With a password, players must type it to
; join (it never crosses the network: the server checks a hash). It is NOT
; encryption: the game's traffic isn't encrypted either way.
password=""

; "ffa" (free-for-all: short rounds, last one standing, a new map every
; round) or "teams" (one long game on one map, respawning, first team to the
; kill target).
mode="ffa"

; Which maps to play, comma separated; empty plays the style's usual pool.
; free-for-all: stack, terrace, switchback, archipelago, rift
; teams: boulevard, holdfast, depot
maps=""

; Bots added to each game (0-15), to fill in when few people are on.
bots=0

; Seconds between one game ending (or the first person arriving) and the next.
start_delay=5.0

; Whether players can find it under "find a game" without typing its address:
; players on the same network always can, and anyone using the list server
; below. A public server can still have a password (it's shown locked).
; Answers players on the local network on UDP 27940-27943.
public=false

; The list server to keep it listed on while it's public ("host" or
; "host:port"; 27950 if no port). Empty: found on the local network only.
; Its address is shown to anyone who asks the list server for the list.
list=""

[rules]

; The game's options, like a host's in the lobby: any of GameRules' settings
; (src/game/game_rules.gd), on top of the mode's own. Anything that doesn't
; make sense is ignored. A few of the common ones (remove the ; to use them):

; Health (100 by default), and seconds untouched before it starts coming
; back (0: never; teams 5).
;max_health=150
;regen_delay=0

; free-for-all: seconds a round lasts (0: no limit) and round wins to take
; the match.
;round_time=70
;round_wins=5

; teams: kills to win (0: none) and seconds the game lasts (0: no limit).
;score_to_win=50
;time_limit=600

; The guns in play (pistol, revolver, smg, rifle, shotgun, sniper); pads for
; any other hand out one of these. [] for fists only.
;guns=["rifle", "sniper"]
